<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>amirito login page</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&display=swap" rel="stylesheet">
        <style>
            body {
                font-family: 'Baloo 2', sans-serif;
                background: linear-gradient(90deg, #1B5E3B 50%, #F3E29A 50%); 
                text-align: left
                padding: 50px;
                .logo {
                    width: 125px;
                    height: 125px;
                    border-radius: 50%;
                    object-fit: cover;
                    position: absolute;
                    top: 42px;
                    left: 40px;
                    z-index: 10;
                }
                h1{
                    color: #FFD686;
                    font-size: 56px;
                    margin-bottom: 0;
                }
                h2{
                    color: #FFD686;
                    font-size: 56px;
                    margin-top: 0;
                    line-height: 0.9;
                }
                .left-side {
                    position: absolute;
                    top: 30px;
                    left: 40px;
                    width: 40px;
                }
                .text-group {
                    position: absolute;
                    top: 0px;
                    right: 52%;
                    text-align: right;
                }
                .buttons{
                    display: flex;
                    flex-direction: column;
                    width: 300px;
                    top: 30%;
                    left: 15%;
                    position: absolute;
                }
                .buttons label{
                    color: #ffffff;
                    font-size: 30px;
                    font-weight: bold;
                    margin-bottom: 4px;
                    margin-top: 10px;
                    text-align: center;
                    
                }
                .buttons input{
                    padding: 10px 15px;
                    border-radius: 50px;
                    border: 1px solid #FFD686;
                    font-size: 20px;
                    background-color: #FFD686;

                }
                .buttons button {
                    margin-top: 25px;
                    padding: 10px 30px;
                    border-radius: 50px;
                    border: none;
                    background-color: #FFD686;
                    color: #1b5e3b;
                    font-weight: bold;
                    font-size: 20px;
                    font-family: 'Baloo 2', sans-serif;
                    cursor: pointer;
                    width: auto;
                    align-self: center;
                }
                h3{
                   color: #ffffff;
                   font-size: 15px;
                   top: 87%;
                   left: 19%;
                   position: absolute;
                }
                .text-button{
                    background: none;      
                    border: none;          
                    padding: 0;             
                    font-family: inherit;
                    font-size: 15px;
                    font-weight: bold;  
                    color: #FFD686;         
                    cursor: pointer;
                    display: flex;
                    flex-direction: column;
                    width: 300px;
                    top: 92%;
                    left: 15%;
                    position: absolute;
                }
                .img{
                    width: 50%;
                    height: 98%;
                    left:50%;
                    object-fit: cover;
                    position: absolute;
                }
        </style>
    </head>
    <body>
        <div class="Left-Side"> 
            <img src="logo.jpg" alt="logo" class="logo">
            <div class="text-group">
                <h1> Hello!</h1>
                <h2> Welcome back :) </h2>
            </div>
        </div>
        <div class="buttons">
            <label for ="username">Username</label>
            <input type="text" id="username" placeholder="Enter your name">

            <label for ="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for ="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">

            <button type ="submit" id="signup-btn">Sign up</button>
        </div>
        <h3> Already have an account?</h3>
        <button type ="button" class="text-button">Sign in</button>
        <img src="right picture.jpg" alt="img" class="img">
        <script src="script.js"></script>
    </body>
</html>
