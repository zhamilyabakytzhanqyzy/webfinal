<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Amirito</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body data-page="register" class="auth-page">
  <main class="auth-layout">
    <section class="auth panel"><img class="auth-logo" src="assets/logo.png" alt="Amirito"><p class="eyebrow">JOIN AMIRITO</p><h1>Create an account</h1><div id="message" class="message" role="status"></div><form id="registerForm"><label for="fullName">Full name</label><input id="fullName" name="fullName" maxlength="80" required><label for="username">Username</label><input id="username" name="username" minlength="3" maxlength="24" required><label for="email">Email</label><input id="email" name="email" type="email" required><label for="password">Password (8+ characters)</label><input id="password" name="password" type="password" minlength="8" required><button class="btn" type="submit">Create account</button></form><p>Already registered? <a href="login.html">Sign in</a></p></section>
    <aside class="auth-art"><span class="art-mark">amirito</span><h2>Good things<br>are on the menu.</h2><p>Fresh ingredients. Big flavour. Happy lunch breaks.</p><div class="art-sandwich">🥪</div></aside>
  </main>
</body>
</html>
