<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order summary | Amirito</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body data-page="checkout">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Amirito home"><img src="assets/logo.png" alt="Amirito logo"></a>
    <nav class="main-nav" aria-label="Main navigation">
      <a class="nav-pill" href="index.html">Home</a>
      <a class="nav-pill" href="menu.html">Menu</a>
      <a class="nav-pill" href="support.html">Contact</a>
    </nav>
    <div class="header-actions" id="headerActions"></div>
  </header>
  <main class="page-shell">
    <section class="intro"><p class="eyebrow">ALMOST THERE</p><h1>Order summary</h1><p>Check your choices and confirm your delivery details.</p></section><div id="message" class="message" role="status"></div><div class="two-col"><section class="panel"><h2>Your selection</h2><div id="summary"></div><div class="total"><span>Total</span><strong id="total"></strong></div><a href="menu.html">← Change selection</a></section><section class="panel"><h2>Delivery details</h2><form id="orderForm"><label for="customerName">Full name</label><input id="customerName" name="customerName" maxlength="80" required><label for="address">Office / delivery address</label><textarea id="address" name="address" rows="3" maxlength="220" required></textarea><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" maxlength="30" required><button class="btn" type="submit">Confirm order</button></form><p class="small">Demo checkout only. No payment is collected.</p></section></div>
  </main>
  <footer class="site-footer">© <span data-current-year></span> Amirito · Freshly grilled, made daily.</footer>
</body>
</html>
