<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Product — Amirito</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="logo" href="index.html">amirito</a><nav class="nav"><a href="admin.html">← Admin dashboard</a></nav></header><main class="wrap"><section class="panel" style="max-width:720px;margin:auto"><h1>Add a Product</h1><form id="addProductForm"><div class="field"><label for="type">Product category</label><select id="type" required><option>Sandwiches</option><option>Drinks</option><option>Snacks</option></select></div><div class="field"><label for="name">Product name</label><input id="name" required maxlength="70" placeholder="e.g. Tandoori Chicken Sandwich"></div><div class="field"><label for="description">Description (maximum 100 characters)</label><textarea id="description" maxlength="100" required placeholder="Describe the ingredients and flavour"></textarea><small id="descriptionCount">Maximum 100 characters</small></div><div class="field"><label for="price">Price: <span id="priceValue">500 ₸</span></label><input id="price" type="range" min="50" max="500" step="10" value="500" required></div><div class="field"><label for="image">Upload product image (optional, max 2 MB)</label><input id="image" type="file" accept="image/*"></div><button type="submit">Save product</button></form><p class="muted">Products are saved in this browser's localStorage for the demo, not MySQL.</p></section></main><script src="script.js"></script><script>const d=document.getElementById('description'),c=document.getElementById('descriptionCount');d.addEventListener('input',()=>c.textContent=d.value.length+'/100 characters');</script></body></html>
