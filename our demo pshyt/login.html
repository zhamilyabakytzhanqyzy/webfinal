<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Amirito</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><div class="panel" style="max-width:620px;margin:35px auto"><div class="row"><a class="logo" href="index.html">amirito</a><a href="index.html">← Home</a></div><h1>Hello! Welcome back :)</h1><p class="muted">Demo sign in — no real authentication or backend is connected.</p><form id="loginForm"><div class="field"><label for="name">Name (optional)</label><input id="name" placeholder="Your name"></div><div class="field"><label for="email">Email</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" type="password" required minlength="4" placeholder="At least 4 characters"></div><div class="field"><label for="role">Sign in as</label><select id="role"><option value="customer">Customer</option><option value="admin">Admin</option></select></div><button type="submit">Sign in</button></form><div class="notice">For the assignment demo, choose Customer or Admin from the dropdown. Passwords are not saved.</div></div></main><script src="script.js"></script></body></html>
