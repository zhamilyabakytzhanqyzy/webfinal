<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Amirito</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="logo" href="index.html">amirito</a><nav class="nav"><a href="menu.html">← Back to menu</a></nav></header><main class="wrap"><h1>Checkout</h1><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><section class="panel"><h2>Order summary</h2><div id="checkoutItems"></div><hr><h2>Total: <span id="checkoutTotal">0 ₸</span></h2></section><section class="panel"><h2>Delivery details</h2><form id="checkoutForm"><div class="field"><label for="fullName">Full name</label><input id="fullName" required></div><div class="field"><label for="email">Email</label><input id="email" type="email" required></div><div class="field"><label for="phone">Phone number</label><input id="phone" type="tel" required></div><div class="field"><label for="address">Delivery address</label><textarea id="address" required maxlength="250"></textarea></div><button type="submit">Place order</button></form></section></div><div class="notice">This is a frontend assignment demo. No real payment is taken and order data is stored only in this browser.</div></main><script src="script.js"></script></body></html>
